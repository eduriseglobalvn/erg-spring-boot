spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: erg-spring
  modulith:
    events:
      registry-trigger-annotation: org.springframework.modulith.events.ApplicationModuleListener
      completion-mode: delete
      jdbc:
        schema-initialization:
          enabled: false
  autoconfigure:
    # MongoDB and Redis are optional infrastructure in the current Spring service.
    # Keep them opt-in so local/dev boots and actuator health do not block on
    # localhost:27017 or unavailable external Redis DNS.
    exclude: ${SPRING_AUTOCONFIGURE_EXCLUDE:org.springframework.boot.mongodb.autoconfigure.MongoAutoConfiguration,org.springframework.boot.data.mongodb.autoconfigure.DataMongoAutoConfiguration,org.springframework.boot.data.mongodb.autoconfigure.DataMongoRepositoriesAutoConfiguration,org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration,org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration}
  threads:
    virtual:
      enabled: ${SPRING_THREADS_VIRTUAL_ENABLED:false}
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      pool-name: erg-hikari
      # Ràng buộc: (số instance) × maximum-pool-size ≤ Postgres max_connections (mặc định 100).
      # Default 25 ⇒ tối đa ~4 instance với Postgres mặc định; nâng max_connections trước khi scale rộng hơn.
      maximum-pool-size: ${DB__MAX_OPEN_CONNS:25}
      minimum-idle: ${DB__MAX_IDLE_CONNS:5}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:5000}
      validation-timeout: ${SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT:5000}
      initialization-fail-timeout: ${SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT:1}
      idle-timeout: ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:300000}
      max-lifetime: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:1800000}
      auto-commit: false
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: ${FLYWAY_BASELINE_VERSION:0}
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:${MONGODB__URI}}
      database: ${SPRING_DATA_MONGODB_DATABASE:${MONGODB__DATABASE}}
      authentication-database: ${SPRING_DATA_MONGODB_AUTHENTICATION_DATABASE:${MONGODB__AUTH_SOURCE}}
      auto-index-creation: ${SPRING_DATA_MONGODB_AUTO_INDEX_CREATION:false}
    redis:
      repositories:
        enabled: false
      url: ${SPRING_DATA_REDIS_URL}
      database: ${SPRING_DATA_REDIS_DATABASE:${REDIS__DB:0}}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:${REDIS__READ_TIMEOUT:3s}}
      connect-timeout: ${SPRING_DATA_REDIS_CONNECT_TIMEOUT:${REDIS__DIAL_TIMEOUT:5s}}
      lettuce:
        pool:
          max-active: ${REDIS__POOL_SIZE:10}
          max-idle: ${REDIS__POOL_SIZE:10}
          min-idle: ${REDIS__MIN_IDLE_CONNS:5}
          max-wait: ${SPRING_DATA_REDIS_LETTUCE_POOL_MAX_WAIT:5s}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: ${SPRING_JPA_HIBERNATE_DEFAULT_BATCH_FETCH_SIZE:100}
        jdbc:
          batch_size: ${SPRING_JPA_HIBERNATE_JDBC_BATCH_SIZE:50}
          batch_versioned_data: ${SPRING_JPA_HIBERNATE_JDBC_BATCH_VERSIONED_DATA:true}
          time_zone: Asia/Ho_Chi_Minh
          timeout: ${SPRING_JPA_HIBERNATE_JDBC_TIMEOUT_SECONDS:5}
        order_inserts: ${SPRING_JPA_HIBERNATE_ORDER_INSERTS:true}
        order_updates: ${SPRING_JPA_HIBERNATE_ORDER_UPDATES:true}
      jakarta:
        persistence:
          query:
            timeout: ${SPRING_JPA_QUERY_TIMEOUT_MS:5000}
  mail:
    # SMTP in Spring Boot is configured through `spring.mail.*`, not through a custom app namespace.
    host: ${SPRING_MAIL_HOST:${SMTP__HOST:localhost}}
    port: ${SPRING_MAIL_PORT:${SMTP__PORT:1025}}
    username: ${SPRING_MAIL_USERNAME:${SMTP__USERNAME:}}
    password: ${SPRING_MAIL_PASSWORD:${SECRET_SMTP__PASSWORD:${SMTP__PASSWORD:}}}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:${SMTP__AUTH:false}}
          ssl:
            enable: ${SPRING_MAIL_SSL_ENABLED:${SMTP__SSL:false}}
          starttls:
            enable: ${SPRING_MAIL_STARTTLS_ENABLED:${SMTP__STARTTLS:true}}
            required: ${SPRING_MAIL_STARTTLS_REQUIRED:false}
  graphql:
    http:
      path: ${SPRING_GRAPHQL_PATH:/api/v1/graphql}
    graphiql:
      enabled: ${SPRING_GRAPHQL_GRAPHIQL_ENABLED:false}
    schema:
      # The canonical assembled schema is loaded from graphql/; module fragments
      # under graphql/modules/ are build-time sources and must not be parsed
      # independently by Spring GraphQL.
      locations: ${SPRING_GRAPHQL_SCHEMA_LOCATIONS:classpath:/graphql/}
      introspection:
        enabled: ${SPRING_GRAPHQL_SCHEMA_INTROSPECTION_ENABLED:${ERG_GRAPHQL_INTROSPECTION_ENABLED:false}}

# These bindings must be common, not hidden inside the staging-only document below.
# A Spring-imported .env is a property source, not a process environment, so
# SERVER_PORT must be referenced explicitly for IDE launches to reach the Nginx
# dev upstream on port 1606.
server:
  address: ${SERVER_ADDRESS:${HTTP__HOST:${APP__HOST:0.0.0.0}}}
  port: ${SERVER_PORT:${HTTP__PORT:${APP__PORT:1606}}}
  forward-headers-strategy: framework
  shutdown: graceful

---
spring:
  config:
    activate:
      on-profile: staging
  modulith:
    detection-strategy: explicitly-annotated
    runtime:
      verification-enabled: true

server:
  address: ${SERVER_ADDRESS:${HTTP__HOST:${APP__HOST:0.0.0.0}}}
  port: ${SERVER_PORT:${HTTP__PORT:${APP__PORT:1606}}}
  forward-headers-strategy: framework
  shutdown: graceful
  tomcat:
    # Cap how much of an aborted/rejected request body Tomcat will swallow to keep the
    # connection alive. Just above the 15MB media limit so legitimately-sized rejects drain
    # cleanly, but an oversized upload gets its connection reset instead of buffered.
    max-swallow-size: ${SERVER_TOMCAT_MAX_SWALLOW_SIZE:16MB}
    # Make Tomcat sizing explicit/overridable. Defaults match Tomcat's built-in values
    # (max=200, accept-count=100) so behaviour is unchanged until ops tunes them.
    threads:
      max: ${SERVER_TOMCAT_THREADS_MAX:200}
    accept-count: ${SERVER_TOMCAT_ACCEPT_COUNT:100}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:0.1}
    export:
      zipkin:
        endpoint: ${MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,prometheus}
  endpoint:
    health:
      probes:
        enabled: ${MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED:true}
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:never}
    prometheus:
      access: ${MANAGEMENT_ENDPOINT_PROMETHEUS_ACCESS:read-only}
  prometheus:
    metrics:
      export:
        enabled: ${MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED:true}
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${ERG_TELEMETRY_ENVIRONMENT:${APP__ENV:development}}
  health:
    mongo:
      enabled: ${MANAGEMENT_HEALTH_MONGO_ENABLED:false}
    redis:
      enabled: ${MANAGEMENT_HEALTH_REDIS_ENABLED:false}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
    path: /v3/api-docs

scalar:
  enabled: ${SCALAR_ENABLED:false}
  path: /scalar
  url: /v3/api-docs

logging:
  level:
    root: ${ROOT_LOG_LEVEL:INFO}
    com.erg.ergspringboot: ${LOGGING__LEVEL:DEBUG}
    com.erg.ergspringboot.config.persistence.TenantAwareJpaTransactionManager: ${TENANT_TX_LOG_LEVEL:INFO}
    org.hibernate.SQL: ${HIBERNATE_SQL_LOG_LEVEL:OFF}
    org.hibernate.orm.jdbc.bind: ${HIBERNATE_BIND_LOG_LEVEL:OFF}
    org.springframework.jdbc.core: ${SPRING_JDBC_LOG_LEVEL:OFF}

erg:
  observability:
    prometheus-public-enabled: ${ERG_OBSERVABILITY_PROMETHEUS_PUBLIC_ENABLED:false}
  webhook:
    max-body-bytes: ${ERG_WEBHOOK_MAX_BODY_BYTES:65536}
    replay-ttl: ${ERG_WEBHOOK_REPLAY_TTL:24h}
    timestamp-tolerance: ${ERG_WEBHOOK_TIMESTAMP_TOLERANCE:5m}
    discord-public-key: ${SECRET_DISCORD_WEBHOOK_PUBLIC_KEY:}
    telegram-secret-token: ${SECRET_TELEGRAM_WEBHOOK_TOKEN:}
  module-events:
    recovery:
      enabled: ${ERG_MODULE_EVENTS_RECOVERY_ENABLED:true}
      fixed-delay: ${ERG_MODULE_EVENTS_RECOVERY_FIXED_DELAY:30s}
      batch-size: ${ERG_MODULE_EVENTS_RECOVERY_BATCH_SIZE:100}
      max-in-flight: ${ERG_MODULE_EVENTS_RECOVERY_MAX_IN_FLIGHT:16}
      min-age: ${ERG_MODULE_EVENTS_RECOVERY_MIN_AGE:30s}
    io:
      core-size: ${ERG_MODULE_EVENTS_IO_CORE_SIZE:8}
      max-size: ${ERG_MODULE_EVENTS_IO_MAX_SIZE:16}
      queue-capacity: ${ERG_MODULE_EVENTS_IO_QUEUE_CAPACITY:0}
    cpu:
      parallelism: ${ERG_MODULE_EVENTS_CPU_PARALLELISM:4}
      queue-capacity: ${ERG_MODULE_EVENTS_CPU_QUEUE_CAPACITY:32}
  cache:
    l2-enabled: ${ERG_REDIS_CACHE_ENABLED:false}
    l2-names: ${ERG_REDIS_CACHE_L2_NAMES:}
    circuit-open-duration: ${ERG_REDIS_CACHE_CIRCUIT_OPEN_DURATION:5s}
    circuit-failure-threshold: ${ERG_REDIS_CACHE_CIRCUIT_FAILURE_THRESHOLD:3}
    max-in-flight-loads: ${ERG_CACHE_MAX_IN_FLIGHT_LOADS:1024}
  quiz:
    package:
      # HMAC is retained only for legacy web rows. Portable desktop packages
      # require Ed25519 plus a key managed outside source control.
      signing-key: ${SECRET_QUIZ_PACKAGE_SIGNING_KEY:}
      public-key-id: ${QUIZ_PACKAGE_PUBLIC_KEY_ID:unset}
      signing-algorithm: ${QUIZ_PACKAGE_SIGNING_ALGORITHM:HMAC-SHA256}
      ed25519-private-key: ${SECRET_QUIZ_PACKAGE_ED25519_PRIVATE_KEY:}
    media:
      signing-secret: ${SECRET_MEDIA_URL_SIGNING_KEY:${SECRET_AUTH__JWT_SECRET:}}
      local-root: ${ERG_MEDIA_LOCAL_ROOT:.erg-media}
  redis:
    metrics:
      refresh-interval: ${ERG_REDIS_METRICS_REFRESH_INTERVAL:15s}
    state:
      enabled: ${ERG_REDIS_STATE_ENABLED:false}
      url: ${ERG_REDIS_STATE_URL:${SPRING_DATA_REDIS_URL:}}
      connect-timeout: ${ERG_REDIS_STATE_CONNECT_TIMEOUT:1s}
      command-timeout: ${ERG_REDIS_STATE_COMMAND_TIMEOUT:1s}
      pool-size: ${ERG_REDIS_STATE_POOL_SIZE:16}
      min-idle: ${ERG_REDIS_STATE_MIN_IDLE:4}
    cache:
      enabled: ${ERG_REDIS_CACHE_ENABLED:false}
      url: ${ERG_REDIS_CACHE_URL:}
      connect-timeout: ${ERG_REDIS_CACHE_CONNECT_TIMEOUT:250ms}
      command-timeout: ${ERG_REDIS_CACHE_COMMAND_TIMEOUT:500ms}
      pool-size: ${ERG_REDIS_CACHE_POOL_SIZE:24}
      min-idle: ${ERG_REDIS_CACHE_MIN_IDLE:4}
  process-local:
    enabled: ${ERG_PROCESS_LOCAL_ENABLED:false}
  outbox:
    worker:
      enabled: ${ERG_OUTBOX_WORKER_ENABLED:true}
      fixed-delay-ms: ${ERG_OUTBOX_WORKER_FIXED_DELAY_MS:5000}
  reporting:
    worker:
      enabled: ${ERG_REPORTING_WORKER_ENABLED:true}
      fixed-delay-ms: ${ERG_REPORTING_WORKER_FIXED_DELAY_MS:5000}
    reconciliation:
      enabled: ${ERG_REPORTING_RECONCILIATION_ENABLED:true}
      fixed-delay-ms: ${ERG_REPORTING_RECONCILIATION_FIXED_DELAY_MS:5000}
  performance:
    read-executor:
      core-size: ${ERG_PERFORMANCE_READ_EXECUTOR_CORE_SIZE:4}
      max-size: ${ERG_PERFORMANCE_READ_EXECUTOR_MAX_SIZE:4}
      queue-capacity: ${ERG_PERFORMANCE_READ_EXECUTOR_QUEUE_CAPACITY:32}
      shutdown-timeout: ${ERG_PERFORMANCE_READ_EXECUTOR_SHUTDOWN_TIMEOUT:5s}
  openapi:
    server-url: ${ERG_OPENAPI_SERVER_URL:/}
  app:
    env: ${APP__ENV:development}
    read-timeout: ${APP__READ_TIMEOUT:15s}
    write-timeout: ${APP__WRITE_TIMEOUT:15s}
    idle-timeout: ${APP__IDLE_TIMEOUT:60s}
    shutdown-time: ${APP__SHUTDOWN_TIME:30s}
  notifications:
    push:
      enabled: ${NOTIFICATIONS__PUSH__ENABLED:false}
      sender-mode: ${NOTIFICATIONS__PUSH__SENDER_MODE:http-v1}
      native-image-strict: ${NOTIFICATIONS__PUSH__NATIVE_IMAGE_STRICT:true}
      project-id: ${FIREBASE_PROJECT_ID:}
      endpoint: ${FIREBASE_FCM_ENDPOINT:https://fcm.googleapis.com}
      connect-timeout: ${NOTIFICATIONS__PUSH__CONNECT_TIMEOUT:3s}
      read-timeout: ${NOTIFICATIONS__PUSH__READ_TIMEOUT:10s}
      default-ttl: ${NOTIFICATIONS__PUSH__DEFAULT_TTL:24h}
      stale-registration-age: ${NOTIFICATIONS__PUSH__STALE_REGISTRATION_AGE:720h}
      max-payload-bytes: ${NOTIFICATIONS__PUSH__MAX_PAYLOAD_BYTES:4096}
      credentials:
        mode: ${FIREBASE_CREDENTIALS_MODE:adc}
        service-account-path: ${GOOGLE_APPLICATION_CREDENTIALS:}
        static-access-token: ${FIREBASE_STATIC_ACCESS_TOKEN:}
        registration-token-encryption-key: ${NOTIFICATIONS__PUSH__REGISTRATION_TOKEN_ENCRYPTION_KEY:}
        registration-token-encryption-required: ${NOTIFICATIONS__PUSH__REGISTRATION_TOKEN_ENCRYPTION_REQUIRED:false}
      worker:
        enabled: ${NOTIFICATIONS__WORKER__ENABLED:true}
        fixed-delay-ms: ${NOTIFICATIONS__WORKER__FIXED_DELAY_MS:10000}
        poll-size: ${NOTIFICATIONS__WORKER__POLL_SIZE:200}
        max-attempts: ${NOTIFICATIONS__WORKER__MAX_ATTEMPTS:8}
        lease-timeout: ${NOTIFICATIONS__WORKER__LEASE_TIMEOUT:60s}
        initial-backoff: ${NOTIFICATIONS__WORKER__INITIAL_BACKOFF:10s}
        max-backoff: ${NOTIFICATIONS__WORKER__MAX_BACKOFF:60m}
  auth:
    jwt-issuer: ${AUTH__JWT_ISSUER:erg-server}
    jwt-algorithms: ${AUTH__JWT_ALGORITHMS:HS256}
    jwt-public-key: ${AUTH__JWT_PUBLIC_KEY:}
    bearer-prefix: ${AUTH__BEARER_PREFIX:Bearer}
    jwt-secret: ${SECRET_AUTH__JWT_SECRET:}
    jwt-refresh-secret: ${SECRET_AUTH__JWT_REFRESH_SECRET:}
    refresh-token-ttl: ${AUTH__REFRESH_TOKEN_TTL:7d}
    admin-email: ${AUTH__ADMIN_EMAIL:admin@erg.edu.vn}
    argon2-memory: ${AUTH__ARGON2_MEMORY:32768}
    argon2-iterations: ${AUTH__ARGON2_ITERATIONS:2}
    max-failed-login: ${AUTH__MAX_FAILED_LOGIN:5}
    failed-login-window: ${AUTH__FAILED_LOGIN_WINDOW:15m}
    block-duration: ${AUTH__BLOCK_DURATION:15m}
    geo-block-enabled: ${AUTH__GEO_BLOCK_ENABLED:true}
    block-unknown-geo: ${AUTH__BLOCK_UNKNOWN_GEO:false}
    allowed-continents: ${AUTH__ALLOWED_CONTINENTS:AS}
    cookie:
      enabled: ${AUTH__COOKIE__ENABLED:true}
      domain: ${AUTH__COOKIE__DOMAIN:}
      secure: ${AUTH__COOKIE__SECURE:true}
      same-site: ${AUTH__COOKIE__SAME_SITE:lax}
      session-name: ${AUTH__COOKIE__SESSION_NAME:__Host-erg_session}
  http:
    host: ${HTTP__HOST:${APP__HOST:0.0.0.0}}
    port: ${HTTP__PORT:${APP__PORT:8080}}
    read-timeout: ${HTTP__READ_TIMEOUT:${APP__READ_TIMEOUT:15s}}
    write-timeout: ${HTTP__WRITE_TIMEOUT:${APP__WRITE_TIMEOUT:15s}}
    idle-timeout: ${HTTP__IDLE_TIMEOUT:${APP__IDLE_TIMEOUT:60s}}
    shutdown-timeout: ${HTTP__SHUTDOWN_TIMEOUT:${APP__SHUTDOWN_TIME:30s}}
    trusted-proxy-cidrs: ${HTTP__TRUSTED_PROXY_CIDRS:}
    rate-limit:
      enabled: ${HTTP__RATE_LIMIT__ENABLED:true}
      requests-per-minute: ${HTTP__RATE_LIMIT__REQUESTS_PER_MINUTE:100}
      burst: ${HTTP__RATE_LIMIT__BURST:20}
    cors:
      allowed-origins: ${HTTP__CORS__ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3003,http://127.0.0.1:3000,http://127.0.0.1:3001,http://127.0.0.1:3003,http://crm.erg.edu.vn:3001,http://lcms.erg.edu.vn:3001,http://lms.erg.edu.vn:3001,http://elearning.erg.edu.vn:3001,https://crm.erg.edu.vn:3001,https://lcms.erg.edu.vn:3001,https://lms.erg.edu.vn:3001,https://elearning.erg.edu.vn:3001}
      allowed-methods: ${HTTP__CORS__ALLOWED_METHODS:GET,POST,PUT,DELETE,PATCH,OPTIONS}
      allowed-headers: ${HTTP__CORS__ALLOWED_HEADERS:Accept,Authorization,Content-Type,X-Tenant-ID,X-Request-ID,X-Trace-ID,X-Idempotency-Key,X-Portal}
      exposed-headers: ${HTTP__CORS__EXPOSED_HEADERS:X-Request-ID,X-Trace-ID,Deprecation,Sunset,Link,X-ERG-API-Owner}
      allow-credentials: ${HTTP__CORS__ALLOW_CREDENTIALS:true}
      max-age: ${HTTP__CORS__MAX_AGE:86400}
  queue:
    redis:
      host: ${QUEUE__REDIS_HOST:${REDIS__HOST:localhost}}
      port: ${QUEUE__REDIS_PORT:${REDIS__PORT:6379}}
      username: ${QUEUE__REDIS_USERNAME:${REDIS__USERNAME:}}
      password: ${SECRET_QUEUE__REDIS_PASSWORD:${QUEUE__REDIS_PASSWORD:${SECRET_REDIS__PASSWORD:${REDIS__PASSWORD:}}}}
      database: ${QUEUE__REDIS_DB:0}
      tls: ${QUEUE__REDIS_TLS:${REDIS__TLS:false}}
    concurrency: ${QUEUE__CONCURRENCY:10}
    retry-delay: ${QUEUE__RETRY_DELAY:10s}
    max-retry: ${QUEUE__MAX_RETRY:3}
    queue-name: ${QUEUE__QUEUE_NAME:default}
    dlq-queue-name: ${QUEUE__DLQ_QUEUE_NAME:erg-dlq}
    retry-backoff: ${QUEUE__RETRY_BACKOFF:true}
    is-server: ${QUEUE__IS_SERVER:true}
  r2:
    enabled: ${R2__ENABLED:false}
    endpoint: ${R2__ENDPOINT:}
    access-key-id: ${SECRET_R2__ACCESS_KEY_ID:${R2__ACCESS_KEY_ID:}}
    secret-key: ${SECRET_R2__SECRET_KEY:${R2__SECRET_KEY:}}
    bucket-name: ${R2__BUCKET_NAME:}
    public-domain: ${R2__PUBLIC_DOMAIN:}
    region: ${R2__REGION:auto}
  ai:
    provider: ${AI__PROVIDER:groq}
    api-key-encryption-secret: ${SECRET_AI__API_KEY_ENCRYPTION_SECRET:${AI__API_KEY_ENCRYPTION_SECRET:}}
    gemini-api-key: ${SECRET_AI__GEMINI_API_KEY:${AI__GEMINI_API_KEY:}}
    gemini-model: ${AI__GEMINI_MODEL:gemini-3-flash-preview}
    gemini-timeout: ${AI__GEMINI_TIMEOUT:10s}
    groq-base-url: ${AI__GROQ_BASE_URL:https://api.groq.com/openai/v1}
    groq-model: ${AI__GROQ_MODEL:openai/gpt-oss-120b}
    groq-api-key: ${SECRET_AI__GROQ_API_KEY:${AI__GROQ_API_KEY:}}
    groq-timeout: ${AI__GROQ_TIMEOUT:30s}
    groq-max-completion-tokens: ${AI__GROQ_MAX_COMPLETION_TOKENS:4096}
    groq-temperature: ${AI__GROQ_TEMPERATURE:1}
    groq-reasoning-effort: ${AI__GROQ_REASONING_EFFORT:medium}
    huggingface-image-base-url: ${AI__HUGGINGFACE_IMAGE_BASE_URL:https://router.huggingface.co}
    huggingface-image-api-key: ${SECRET_AI__HUGGINGFACE_IMAGE_API_KEY:${AI__HUGGINGFACE_IMAGE_API_KEY:}}
    huggingface-image-provider: ${AI__HUGGINGFACE_IMAGE_PROVIDER:fal-ai}
    huggingface-image-model: ${AI__HUGGINGFACE_IMAGE_MODEL:black-forest-labs/FLUX.1-Krea-dev}
    huggingface-image-timeout: ${AI__HUGGINGFACE_IMAGE_TIMEOUT:90s}
    huggingface-image-width: ${AI__HUGGINGFACE_IMAGE_WIDTH:1024}
    huggingface-image-height: ${AI__HUGGINGFACE_IMAGE_HEIGHT:576}
    huggingface-image-steps: ${AI__HUGGINGFACE_IMAGE_STEPS:28}
    huggingface-image-guidance: ${AI__HUGGINGFACE_IMAGE_GUIDANCE:7}
    huggingface-image-negative-prompt: ${AI__HUGGINGFACE_IMAGE_NEGATIVE_PROMPT:text, watermark, logo, blurry, distorted, low quality, extra fingers}
    cache-ttl: ${AI__CACHE_TTL:24h}
    batch-size: ${AI__BATCH_SIZE:10}
  telemetry:
    enabled: ${TELEMETRY__ENABLED:false}
    service-name: ${TELEMETRY__SERVICE_NAME:erg-server}
    service-version: ${TELEMETRY__SERVICE_VERSION:0.1.0}
    environment: ${TELEMETRY__ENVIRONMENT:${APP__ENV:development}}
    jaeger-endpoint: ${TELEMETRY__JAEGER_ENDPOINT:}
  logging:
    format: ${LOGGING__FORMAT:console}
    time-format: ${LOGGING__TIME_FORMAT:rfc3339}
    mask-sensitive: ${ERG_LOGGING_MASK_SENSITIVE:true}
  graphql:
    require-operation-name: ${ERG_GRAPHQL_REQUIRE_OPERATION_NAME:true}
    introspection-enabled: ${ERG_GRAPHQL_INTROSPECTION_ENABLED:false}
    max-query-length: ${ERG_GRAPHQL_MAX_QUERY_LENGTH:20000}
    max-request-body-bytes: ${ERG_GRAPHQL_MAX_REQUEST_BODY_BYTES:65536}
    max-depth: ${ERG_GRAPHQL_MAX_DEPTH:8}
    max-complexity: ${ERG_GRAPHQL_MAX_COMPLEXITY:500}
    execution-timeout: ${ERG_GRAPHQL_EXECUTION_TIMEOUT:5s}
    max-aliases: ${ERG_GRAPHQL_MAX_ALIASES:20}
    reject-sensitive-variables: ${ERG_GRAPHQL_REJECT_SENSITIVE_VARIABLES:true}
    max-variable-array-items: ${ERG_GRAPHQL_MAX_VARIABLE_ARRAY_ITEMS:100}
    rate-limit:
      enabled: ${ERG_GRAPHQL_RATE_LIMIT_ENABLED:true}
      redis-enabled: ${ERG_GRAPHQL_RATE_LIMIT_REDIS_ENABLED:false}
      fail-closed-on-redis-error: ${ERG_GRAPHQL_RATE_LIMIT_FAIL_CLOSED_ON_REDIS_ERROR:true}
      requests-per-minute: ${ERG_GRAPHQL_RATE_LIMIT_REQUESTS_PER_MINUTE:120}
      burst: ${ERG_GRAPHQL_RATE_LIMIT_BURST:30}
  scraper:
    min-delay: ${SCRAPER__MIN_DELAY:3s}
    max-delay: ${SCRAPER__MAX_DELAY:10s}
    timeout: ${SCRAPER__TIMEOUT:30s}
    max-response-size: ${SCRAPER__MAX_RESPONSE_SIZE:10485760}
    respect-robots-txt: ${SCRAPER__RESPECT_ROBOTS_TXT:true}
    max-retries: ${SCRAPER__MAX_RETRIES:3}
  trending:
    refresh-cron: ${TRENDING__REFRESH_CRON:*/30 * * * *}
    cache-ttl: ${TRENDING__CACHE_TTL:25m}
    feed-limit: ${TRENDING__FEED_LIMIT:100}
    topics-limit: ${TRENDING__TOPICS_LIMIT:20}
    news-limit: ${TRENDING__NEWS_LIMIT:20}
    min-hot-score: ${TRENDING__MIN_HOT_SCORE:75}
  compose:
    enabled: ${COMPOSE__ENABLED:false}
    deploy-manifest-path: ${COMPOSE__DEPLOY_MANIFEST_PATH:deploy.yaml}
  tenant:
    enabled: ${TENANT__ENABLED:false}
    isolation: ${TENANT__ISOLATION:field}
    default-id: ${TENANT__DEFAULT_ID:default}
  lifecycle:
    auth-bootstrap-admin-on-startup: ${LIFECYCLE__AUTH_BOOTSTRAP_ADMIN_ON_STARTUP:false}
    profile-backfill-on-startup: ${LIFECYCLE__PROFILE_BACKFILL_ON_STARTUP:false}
    operation-seed-on-startup: ${LIFECYCLE__OPERATION_SEED_ON_STARTUP:false}
    trending-refresh-on-startup: ${LIFECYCLE__TRENDING_REFRESH_ON_STARTUP:false}
    lms-seed-on-startup: ${LIFECYCLE__LMS_SEED_ON_STARTUP:false}
    question-bank-seed-on-startup: ${LIFECYCLE__QUESTION_BANK_SEED_ON_STARTUP:false}
    school-operations-seed-on-startup: ${LIFECYCLE__SCHOOL_OPERATIONS_SEED_ON_STARTUP:false}

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        generate_statistics: true

---
spring:
  config:
    activate:
      on-profile: test
  task:
    scheduling:
      enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.mongodb.autoconfigure.MongoAutoConfiguration
      - org.springframework.boot.data.mongodb.autoconfigure.DataMongoAutoConfiguration
      - org.springframework.boot.data.mongodb.autoconfigure.DataMongoRepositoriesAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration
  datasource:
    url: jdbc:h2:mem:erg_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  data:
    mongodb:
      uri: mongodb://localhost:27017
      database: erg_test
    redis:
      host: localhost
      port: 6379
  jpa:
    hibernate:
      ddl-auto: validate
erg:
  outbox:
    worker:
      enabled: false
  reporting:
    worker:
      enabled: false
  security:
    # Trusted-header auth is a test-only convenience. It stays DISABLED by default
    # (see ErgSecurityProperties) and is enabled here only for the test profile so
    # contract/security tests can authenticate via X-User-ID/X-Permissions headers.
    trusted-header-auth-enabled: true
  lifecycle:
    auth-bootstrap-admin-on-startup: false
    profile-backfill-on-startup: false
    operation-seed-on-startup: false
    trending-refresh-on-startup: false
    lms-seed-on-startup: false
    question-bank-seed-on-startup: false
  notifications:
    push:
      worker:
        enabled: false

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false
  graphql:
    schema:
      introspection:
        enabled: false

erg:
  process-local:
    enabled: ${ERG_PROCESS_LOCAL_ENABLED:false}
  auth:
    login-rate-limit:
      enabled: ${ERG_AUTH_LOGIN_RATE_LIMIT_ENABLED:true}
      source-per-minute: ${ERG_AUTH_LOGIN_RATE_LIMIT_SOURCE_PER_MINUTE:30}
      account-per-minute: ${ERG_AUTH_LOGIN_RATE_LIMIT_ACCOUNT_PER_MINUTE:10}
      device-per-minute: ${ERG_AUTH_LOGIN_RATE_LIMIT_DEVICE_PER_MINUTE:20}
    rapid-session-replacement:
      threshold: ${ERG_AUTH_RAPID_SESSION_REPLACEMENT_THRESHOLD:5}
      window-minutes: ${ERG_AUTH_RAPID_SESSION_REPLACEMENT_WINDOW_MINUTES:10}
    refresh-token-history:
      retention-cron: ${ERG_AUTH_REFRESH_TOKEN_HISTORY_RETENTION_CRON:0 20 3 * * *}
    cookie:
      secure: true
      same-site: strict

springdoc:
  api-docs:
    enabled: false

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

scalar:
  enabled: false

logging:
  level:
    com.erg.ergspringboot: INFO
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
    org.springframework.jdbc.core: OFF

---
# Opt-in distributed Redis preset. Activate alongside your env profile, e.g.
#   SPRING_PROFILES_ACTIVE=prod,redis
# Flipping these flags on together switches rate-limiting and cache-invalidation
# from per-instance (Caffeine local) to distributed/cross-instance:
#   - state.enabled    -> creates the shared StringRedisTemplate + pub/sub subscriber
#                         (RedisCacheGenerationService) and the GraphQlRateLimitCounterRouter,
#                         so AuthLoginRateLimiter and cache generation go cross-instance.
#   - graphql.rate-limit.redis-enabled -> GraphQlRateLimiter actually routes to the router.
#   - cache.enabled + cache.l2-enabled -> enables the L2 RedisCacheStore.
# URLs stay in env (never hardcoded here). Startup fails fast if a URL is missing:
#   - state uses SPRING_DATA_REDIS_URL (via erg.redis.state.url fallback)
#   - L2 cache uses ERG_REDIS_CACHE_URL (separate endpoint; no fallback by design)
# Both are validated by ErgRedisProperties @AssertTrue -> context fails to start.
# NOTE: L2 caches nothing until ERG_REDIS_CACHE_L2_NAMES lists the cache names to promote.
spring:
  config:
    activate:
      on-profile: redis
erg:
  cache:
    l2-enabled: true
  redis:
    state:
      enabled: true
    cache:
      enabled: true
  graphql:
    rate-limit:
      redis-enabled: true
