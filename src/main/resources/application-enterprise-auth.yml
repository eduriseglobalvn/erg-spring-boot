spring:
  autoconfigure:
    exclude: ${SPRING_AUTOCONFIGURE_EXCLUDE:org.springframework.boot.mongodb.autoconfigure.MongoAutoConfiguration,org.springframework.boot.data.mongodb.autoconfigure.DataMongoAutoConfiguration,org.springframework.boot.data.mongodb.autoconfigure.DataMongoRepositoriesAutoConfiguration}
  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: ${ERG_KEYCLOAK_ISSUER_URI}
        registration:
          erg-api:
            provider: keycloak
            client-id: ${ERG_KEYCLOAK_CLIENT_ID:erg-api}
            client-secret: ${ERG_KEYCLOAK_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            scope: openid,profile,email
  session:
    timeout: ${ERG_SESSION_IDLE_TIMEOUT:2h}
    redis:
      namespace: erg:session
      flush-mode: on-save

server:
  servlet:
    session:
      cookie:
        name: __Host-erg_session
        http-only: true
        secure: true
        same-site: lax
        path: /

erg:
  auth:
    bff-enabled: true
    local-login-enabled: false
  http:
    cors:
      # Browser/PWA BFF clients are explicit origins. Override with the deployment
      # environment for staging; never use a wildcard with credentials.
      allowed-origins: ${ERG_BFF_CORS_ALLOWED_ORIGINS:https://lms.erg.edu.vn,https://crm.erg.edu.vn,https://auth.erg.edu.vn}
      allowed-headers: ${ERG_BFF_CORS_ALLOWED_HEADERS:Accept,Content-Type,X-Request-ID,X-Trace-ID,X-Idempotency-Key,X-XSRF-TOKEN}
      allow-credentials: true
