resolver 127.0.0.11 valid=10s ipv6=off;

limit_req_zone $binary_remote_addr zone=erg_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=erg_login:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=erg_graphql:10m rate=15r/s;
limit_conn_zone $binary_remote_addr zone=erg_connections:10m;

upstream erg_backend {
    zone erg_backend 64k;
    least_conn;
    server backend:1606 resolve;
    keepalive 32;
}

server {
    listen 8080;
    server_name _;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api/v1/auth/login {
        limit_req zone=erg_login burst=10 nodelay;
        limit_conn erg_connections 20;
        limit_req_status 429;
        add_header Retry-After 1 always;
        proxy_pass http://erg_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location = /api/v1/graphql {
        limit_req zone=erg_graphql burst=30 nodelay;
        limit_conn erg_connections 100;
        limit_req_status 429;
        add_header Retry-After 1 always;
        proxy_pass http://erg_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        limit_req zone=erg_general burst=60;
        limit_conn erg_connections 200;
        proxy_pass http://erg_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
    }
}
