resolver 127.0.0.11 valid=10s ipv6=off;

# Cloudflare Tunnel (cloudflared on the host) is the only client: the port is bound to 127.0.0.1 and
# requests arrive from the Docker gateway. Take the visitor address from Cloudflare so rate limits and
# the X-Forwarded-For sent to the backend are per visitor, not one shared gateway address.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 127.0.0.1;
real_ip_header CF-Connecting-IP;

# OPS-01: a whole school shares one public IP, so per-IP zones are sized for a computer lab, not one
# person. Per-account login (10/min) and per-user GraphQL limits in the backend stay the abuse fence.
limit_req_zone $binary_remote_addr zone=erg_general:10m rate=300r/s;
limit_req_zone $binary_remote_addr zone=erg_login:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=erg_graphql:10m rate=150r/s;
limit_conn_zone $binary_remote_addr zone=erg_connections:10m;

upstream erg_backend {
    zone erg_backend 64k;
    least_conn;
    server backend:1606 resolve;
    keepalive 32;
}

server {
    listen 8080;
    server_name _;
    # OPS-03: attendance selfies (2 MB) and multipart requests (3 MB) must reach the backend.
    client_max_body_size 4m;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Prometheus scrapes backend:1606 inside Docker; nothing under /actuator is public.
    location ^~ /actuator/ {
        return 404;
    }

    location = /api/v1/auth/login {
        limit_req zone=erg_login burst=100 nodelay;
        limit_conn erg_connections 300;
        limit_req_status 429;
        add_header Retry-After 1 always;
        proxy_pass http://erg_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location = /api/v1/graphql {
        limit_req zone=erg_graphql burst=300 nodelay;
        limit_conn erg_connections 1500;
        limit_req_status 429;
        add_header Retry-After 1 always;
        proxy_pass http://erg_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        limit_req zone=erg_general burst=600;
        limit_conn erg_connections 3000;
        proxy_pass http://erg_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
    }
}
