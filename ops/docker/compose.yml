name: erg

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-erg}
      POSTGRES_USER: ${POSTGRES_USER:-erg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erg-local-password}
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-100}
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_io_timing=on
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis-state:
    image: redis:8.8.0-alpine3.23
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_STATE_PASSWORD:-erg-local-redis-state}
      REDISCLI_AUTH: ${REDIS_STATE_PASSWORD:-erg-local-redis-state}
    command:
      - redis-server
      - /usr/local/etc/redis/state.conf
      - --requirepass
      - ${REDIS_STATE_PASSWORD:-erg-local-redis-state}
    mem_limit: ${REDIS_STATE_CONTAINER_MEMORY:-1280m}
    volumes:
      - redis-state-data:/data
      - ./redis/state.conf:/usr/local/etc/redis/state.conf:ro
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  redis-cache:
    image: redis:8.8.0-alpine3.23
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_CACHE_PASSWORD:-erg-local-redis-cache}
      REDISCLI_AUTH: ${REDIS_CACHE_PASSWORD:-erg-local-redis-cache}
    command:
      - redis-server
      - /usr/local/etc/redis/cache.conf
      - --requirepass
      - ${REDIS_CACHE_PASSWORD:-erg-local-redis-cache}
    mem_limit: ${REDIS_CACHE_CONTAINER_MEMORY:-2560m}
    volumes:
      - redis-cache-data:/data
      - ./redis/cache.conf:/usr/local/etc/redis/cache.conf:ro
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

networks:
  edge:
  data:
    internal: true

volumes:
  postgres-data:
  redis-state-data:
  redis-cache-data:
