name: erg

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-erg}
      POSTGRES_USER: ${POSTGRES_USER:-erg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erg-local-password}
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:-erg_app}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:-erg-local-runtime-password}
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-60}
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_io_timing=on
      # Sized for the 16 GB / 4-core / SATA SSD host (fable/03 section 4). Keep in sync with compose.benchmark.yml.
      - -c
      - shared_buffers=3GB
      - -c
      - effective_cache_size=7GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - wal_buffers=16MB
      - -c
      - max_wal_size=2GB
      - -c
      - min_wal_size=512MB
      - -c
      - checkpoint_timeout=10min
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - synchronous_commit=on
      - -c
      - jit=off
      - -c
      - autovacuum_vacuum_scale_factor=0.05
      - -c
      - autovacuum_naptime=20s
      # Runaway-query guard for the app pool. Flyway (FlywayConfig) and pg_dump set it to 0 for their own sessions.
      - -c
      - statement_timeout=30s
      - -c
      - idle_in_transaction_session_timeout=30s
      - -c
      - log_min_duration_statement=250ms
    # Budget for a 16 GB host (fable/03 section 3): shared_buffers 3GB is ~60% of this limit.
    mem_limit: ${POSTGRES_CONTAINER_MEMORY:-5g}
    # Parallel workers use /dev/shm; Docker's 64 MB default fails large sorts/hash joins.
    shm_size: 512m
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis-state:
    image: redis:8.8.0-alpine3.23
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_STATE_PASSWORD:-erg-local-redis-state}
      REDISCLI_AUTH: ${REDIS_STATE_PASSWORD:-erg-local-redis-state}
    command:
      - redis-server
      - /usr/local/etc/redis/state.conf
      - --requirepass
      - ${REDIS_STATE_PASSWORD:-erg-local-redis-state}
    mem_limit: ${REDIS_STATE_CONTAINER_MEMORY:-512m}
    volumes:
      - redis-state-data:/data
      - ./redis/state.conf:/usr/local/etc/redis/state.conf:ro
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  redis-cache:
    image: redis:8.8.0-alpine3.23
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_CACHE_PASSWORD:-erg-local-redis-cache}
      REDISCLI_AUTH: ${REDIS_CACHE_PASSWORD:-erg-local-redis-cache}
    command:
      - redis-server
      - /usr/local/etc/redis/cache.conf
      - --requirepass
      - ${REDIS_CACHE_PASSWORD:-erg-local-redis-cache}
    mem_limit: ${REDIS_CACHE_CONTAINER_MEMORY:-1024m}
    volumes:
      - redis-cache-data:/data
      - ./redis/cache.conf:/usr/local/etc/redis/cache.conf:ro
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

networks:
  edge:
  data:
    internal: true

volumes:
  postgres-data:
  redis-state-data:
  redis-cache-data:
