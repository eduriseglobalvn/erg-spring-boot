global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - "/etc/prometheus/alerts.yml"

scrape_configs:
  - job_name: "erg-backend"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 5s
    static_configs:
      - targets: ["backend:1606"]

  - job_name: "node-exporter"
    scrape_interval: 10s
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "postgres-exporter"
    scrape_interval: 15s
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: "redis-state-exporter"
    scrape_interval: 15s
    static_configs:
      - targets: ["redis-state-exporter:9121"]

  - job_name: "redis-cache-exporter"
    scrape_interval: 15s
    static_configs:
      - targets: ["redis-cache-exporter:9121"]
