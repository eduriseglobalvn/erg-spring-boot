global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - "/etc/prometheus/alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "erg-backend"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 5s
    static_configs:
      - targets: ["backend:1606"]

  - job_name: "node-exporter"
    scrape_interval: 10s
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "cadvisor"
    scrape_interval: 30s
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "smartctl-exporter"
    scrape_interval: 60s
    static_configs:
      - targets: ["smartctl-exporter:9633"]

  # Outside-in check through Cloudflare: what a student's browser sees, plus the certificate's expiry.
  - job_name: "blackbox"
    metrics_path: /probe
    scrape_interval: 30s
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://api.erg.edu.vn/ready
          - https://lms.erg.edu.vn/healthz
          - https://monitor.erg.edu.vn/api/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: "postgres-exporter"
    scrape_interval: 15s
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: "redis-state-exporter"
    scrape_interval: 15s
    static_configs:
      - targets: ["redis-state-exporter:9121"]

  - job_name: "redis-cache-exporter"
    scrape_interval: 15s
    static_configs:
      - targets: ["redis-cache-exporter:9121"]
