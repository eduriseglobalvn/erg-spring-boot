groups:
  - name: erg-hardware-and-upgrade-alerts
    rules:
      - alert: HostHighCpuLoad
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host CPU utilization > 80% for 10 minutes"
          description: "i5-7500 CPU is consistently saturated ({{ $value | printf \"%.1f\" }}%). Evaluate server upgrade to more cores."

      - alert: HostLowMemoryAvailable
        expr: (node_memory_MemAvailable_bytes / 1024 / 1024) < 1500
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Host free memory < 1.5GB"
          description: "Available RAM is down to {{ $value | printf \"%.0f\" }}MB out of 16GB. Risk of OOM killer. Evaluate RAM upgrade to 32GB+."

      - alert: HostDiskSpaceRunningLow
        expr: ((node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100) < 15
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Root NVMe SSD space < 15% remaining"
          description: "Disk space on 256GB SSD is running out ({{ $value | printf \"%.1f\" }}% remaining). Trigger log/data purge or upgrade storage."

      - alert: HostHighDiskWait
        expr: rate(node_disk_io_time_seconds_total[5m]) > 0.6
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Disk I/O time > 60%"
          description: "SSD I/O bottleneck detected. Disk is busy {{ $value | printf \"%.1f\" }} of the time."

  - name: erg-backend-performance-alerts
    rules:
      - alert: BackendInstanceDown
        expr: up{job="erg-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "ERG Backend instance is down!"
          description: "Backend port 1606 /actuator/prometheus is unreachable."

      - alert: BackendHighP95Latency
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket[5m]))) > 1.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "REST P95 response latency > 1.0s"
          description: "P95 response latency is {{ $value | printf \"%.2f\" }}s. Check slow queries and DB pool."

      - alert: BackendHighErrorRate
        expr: (sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 1)) > 0.05
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "HTTP 5xx error rate > 5%"
          description: "Error ratio has reached {{ $value | printf \"%.2f\" }}%."

      - alert: HikariCPPoolSaturated
        expr: hikaricp_connections_pending > 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL connection pool pending queue > 5"
          description: "HikariCP has queued connection requests. Backend needs larger pool or PostgreSQL tuning."

      - alert: PostgresHighConnections
        expr: pg_stat_activity_count > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL active connections > 80"
          description: "Postgres connections close to limit (max 100/120)."

  - name: erg-dependency-and-abuse-alerts
    rules:
      - alert: ScrapeTargetDown
        expr: up{job!="erg-backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is not reachable"
          description: "Prometheus cannot scrape {{ $labels.instance }}; its database/cache metrics are blind."

      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is down"
          description: "postgres-exporter cannot connect to the database."

      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis ({{ $labels.job }}) is down"
          description: "The exporter cannot reach {{ $labels.instance }}."

      - alert: NotificationOutboxDeadLetters
        expr: max(notifications_outbox_dead) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} notifications will never be sent"
          description: "Outbox rows exhausted their retries (e-mail/OTP/push). Check the backend logs and the SMTP/R2 credentials."

      - alert: LoginFailureSpike
        expr: sum(rate(http_server_requests_seconds_count{uri="/api/v1/auth/login",status=~"401|403"}[5m])) * 60 > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "More than 30 failed logins per minute"
          description: "{{ $value | printf \"%.0f\" }} failed logins/min: possible password guessing."

      - alert: BackendHeapHigh
        expr: max(jvm_memory_used_bytes{area="heap",id="G1 Old Gen"} / jvm_memory_max_bytes{area="heap",id="G1 Old Gen"}) > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Backend old-gen heap > 85%"
          description: "Heap is at {{ $value | humanizePercentage }}; risk of long GC pauses or OOM."

      - alert: BackupStale
        expr: time() - erg_backup_last_success_timestamp_seconds > 26 * 3600 or absent(erg_backup_last_success_timestamp_seconds)
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "No successful database backup in the last 26 hours"
          description: "ops/backup/backup.sh (cron 03:00) did not finish; check /opt/erg/ops/backup/backup.log."

      - alert: BackendContainerMemoryHigh
        expr: sum(jvm_memory_committed_bytes{job="erg-backend"}) > 3.4 * 1024 * 1024 * 1024
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Backend memory near its 4 GB container limit"
          description: "JVM committed memory is {{ $value | humanize1024 }}B; the kernel kills the backend at the limit."
