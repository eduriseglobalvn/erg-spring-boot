services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    networks:
      - data
      - edge

  redis-state:
    ports:
      - "127.0.0.1:${REDIS_STATE_HOST_PORT:-6379}:6379"
    networks:
      - data
      - edge

  redis-cache:
    ports:
      - "127.0.0.1:${REDIS_CACHE_HOST_PORT:-6380}:6379"
    networks:
      - data
      - edge

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${ERG_HTTP_PORT:-8080}:8080"
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 5
