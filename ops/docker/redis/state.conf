bind 0.0.0.0
protected-mode yes
port 6379

appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Keep <= 75% of the 512m container limit: the kernel must not OOM-kill Redis before noeviction refuses writes.
maxmemory 384mb
maxmemory-policy noeviction

slowlog-log-slower-than 10000
slowlog-max-len 256
latency-monitor-threshold 100

