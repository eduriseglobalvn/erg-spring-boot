name: erg-spring-ci

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Compile, architecture and integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: erg
          POSTGRES_USER: erg
          POSTGRES_PASSWORD: erg
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U erg -d erg"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/erg
          SPRING_DATASOURCE_USERNAME: erg
          SPRING_DATASOURCE_PASSWORD: erg
        run: ./mvnw -B -ntp verify

  portal-suites:
    name: Portal contract — ${{ matrix.portal }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: erg
          POSTGRES_USER: erg
          POSTGRES_PASSWORD: erg
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U erg -d erg"
          --health-interval=10s --health-timeout=5s --health-retries=10
    strategy:
      fail-fast: false
      matrix:
        portal: [lms, lcms, crm, elearning]
        include:
          # `tests` selects contract/unit suites (surefire); `itTests` selects the portal's
          # *IntegrationTest classes (failsafe). Surefire excludes *IntegrationTest via pom, so the
          # two globs never double-run the same class. CRM has no integration test yet — the
          # failIfNoSpecifiedTests=false flags keep an empty glob from failing the leg.
          - portal: lms
            tests: '*Lms*Test,*Assignment*Test,*Attempt*Test'
            itTests: '*Lms*IntegrationTest,*Assignment*IntegrationTest,*Attempt*IntegrationTest'
          - portal: lcms
            tests: '*Lcms*Test,*Quiz*Test,*QuestionBank*Test,*Media*Test'
            itTests: '*Lcms*IntegrationTest,*Quiz*IntegrationTest,*QuestionBank*IntegrationTest,*Media*IntegrationTest'
          - portal: crm
            tests: '*Crm*Test'
            itTests: '*Crm*IntegrationTest'
          - portal: elearning
            tests: '*StudentDashboard*Test,*Elearning*Test'
            itTests: '*StudentDashboard*IntegrationTest,*Elearning*IntegrationTest'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run portal contract and integration suite
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/erg
          SPRING_DATASOURCE_USERNAME: erg
          SPRING_DATASOURCE_PASSWORD: erg
          ERG_TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/erg
          ERG_TEST_POSTGRES_USERNAME: erg
          ERG_TEST_POSTGRES_PASSWORD: erg
        run: >-
          ./mvnw -B -ntp
          -Dtest="${{ matrix.tests }}"
          -Dit.test="${{ matrix.itTests }}"
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dfailsafe.failIfNoSpecifiedTests=false
          verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portal-test-reports-${{ matrix.portal }}
          path: |
            target/surefire-reports
            target/failsafe-reports
          if-no-files-found: warn

  openapi-contract:
    name: OpenAPI contract lock and compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Boot runtime and verify OpenAPI/GraphQL parity
        run: >-
          ./mvnw -B -ntp
          -Dtest=OpenApiRuntimeSnapshotIntegrationTest,GraphQlCoverageCatalogIntegrationTest
          test
      - name: Verify committed OpenAPI snapshot and checksum
        run: node scripts/export-openapi-contract.cjs --file contracts/openapi/erg-openapi.json --check
      - name: Verify committed GraphQL schema checksum
        run: node scripts/check-graphql-schema.cjs
      - name: Check breaking changes against pull request base
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/openapi"
          git show "origin/${{ github.base_ref }}:contracts/openapi/erg-openapi.json" > "$RUNNER_TEMP/openapi/base.json"
          node scripts/check-openapi-breaking.cjs \
            --base "$RUNNER_TEMP/openapi/base.json" \
            --revision contracts/openapi/erg-openapi.json
      - name: Check GraphQL breaking changes against pull request base
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git show "origin/${{ github.base_ref }}:src/main/resources/graphql/schema.graphqls" > "$RUNNER_TEMP/openapi/base.graphqls"
          ./mvnw -B -ntp \
            -Dtest=GraphQlSchemaCompatibilityTest \
            -Derg.graphql.base-schema="$RUNNER_TEMP/openapi/base.graphqls" \
            test

  dependency-and-secret-scan:
    name: Dependency and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: dependency-check/Dependency-Check_Action@1e54355a8b4c8abaa8cc7d0b70aa655a3bb15a6c
        with:
          project: erg-spring
          path: .
          format: HTML
          out: reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-report
          path: reports

  native:
    name: Native contract (nightly/release)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: graalvm
          java-version: '25'
          cache: maven
      - name: Native compile
        run: ./mvnw -B -ntp -Pnative -DskipTests native:compile
      - name: Native compose contract
        run: docker compose -f ops/docker/compose.yml -f ops/docker/compose.native.yml config --quiet

  k6-smoke:
    name: k6 smoke (benchmark environment only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      BENCHMARK_BASE_URL: ${{ secrets.BENCHMARK_BASE_URL }}
      BENCHMARK_WEBHOOK_SECRET: ${{ secrets.BENCHMARK_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - name: Run webhook smoke when benchmark URL is supplied
        if: ${{ env.BENCHMARK_BASE_URL != '' && env.BENCHMARK_WEBHOOK_SECRET != '' }}
        env:
          BASE_URL: ${{ env.BENCHMARK_BASE_URL }}
          WEBHOOK_SECRET: ${{ env.BENCHMARK_WEBHOOK_SECRET }}
        run: k6 run --vus 2 --iterations 2 load/k6/webhook-burst.js

  release-load-gates:
    name: Release load and event gates
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BASE_URL: ${{ secrets.BENCHMARK_BASE_URL }}
      ACCESS_TOKEN: ${{ secrets.BENCHMARK_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - name: Require isolated benchmark environment
        shell: bash
        run: test -n "$BASE_URL" && test -n "$ACCESS_TOKEN"
      - name: Steady 100 to 5000 VU gate
        run: k6 run --summary-export=steady.json load/k6/erg-5k-steady.js
      - name: Submission burst gate
        run: k6 run --summary-export=submission.json load/k6/erg-5k-submission-burst.js
      - name: Outbox replay/duplicate gate
        run: k6 run --summary-export=outbox.json load/k6/outbox-dispatch.js
      - name: Modulith event overhead gate
        run: k6 run --summary-export=modulith.json load/k6/modulith-events.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-load-evidence
          path: '*.json'
          if-no-files-found: error
