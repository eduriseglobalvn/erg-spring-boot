name: erg-spring-ci

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Compile, architecture and integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: erg
          POSTGRES_USER: erg
          POSTGRES_PASSWORD: erg
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U erg -d erg"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/erg
          SPRING_DATASOURCE_USERNAME: erg
          SPRING_DATASOURCE_PASSWORD: erg
        run: ./mvnw -B -ntp verify

  openapi-contract:
    name: OpenAPI contract lock and compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify committed OpenAPI snapshot and checksum
        run: node scripts/export-openapi-contract.cjs --file contracts/openapi/erg-openapi.json --check
      - name: Verify committed GraphQL schema checksum
        run: node scripts/check-graphql-schema.cjs
      - name: Check breaking changes against pull request base
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/openapi"
          git show "origin/${{ github.base_ref }}:contracts/openapi/erg-openapi.json" > "$RUNNER_TEMP/openapi/base.json"
          node scripts/check-openapi-breaking.cjs \
            --base "$RUNNER_TEMP/openapi/base.json" \
            --revision contracts/openapi/erg-openapi.json
      - name: Check GraphQL breaking changes against pull request base
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git show "origin/${{ github.base_ref }}:src/main/resources/graphql/schema.graphqls" > "$RUNNER_TEMP/openapi/base.graphqls"
          ./mvnw -B -ntp \
            -Dtest=GraphQlSchemaCompatibilityTest \
            -Derg.graphql.base-schema="$RUNNER_TEMP/openapi/base.graphqls" \
            test

  dependency-and-secret-scan:
    name: Dependency and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: dependency-check/Dependency-Check_Action@1e54355a8b4c8abaa8cc7d0b70aa655a3bb15a6c
        with:
          project: erg-spring
          path: .
          format: HTML
          out: reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-report
          path: reports

  native:
    name: Native contract (nightly/release)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: graalvm
          java-version: '25'
          cache: maven
      - name: Native compile
        run: ./mvnw -B -ntp -Pnative -DskipTests native:compile
      - name: Native compose contract
        run: docker compose -f ops/docker/compose.yml -f ops/docker/compose.native.yml config --quiet

  k6-smoke:
    name: k6 smoke (benchmark environment only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      BENCHMARK_BASE_URL: ${{ secrets.BENCHMARK_BASE_URL }}
      BENCHMARK_WEBHOOK_SECRET: ${{ secrets.BENCHMARK_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - name: Run webhook smoke when benchmark URL is supplied
        if: ${{ env.BENCHMARK_BASE_URL != '' && env.BENCHMARK_WEBHOOK_SECRET != '' }}
        env:
          BASE_URL: ${{ env.BENCHMARK_BASE_URL }}
          WEBHOOK_SECRET: ${{ env.BENCHMARK_WEBHOOK_SECRET }}
        run: k6 run --vus 2 --iterations 2 load/k6/webhook-burst.js
